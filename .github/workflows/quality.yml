name: PULSE quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check demo_mode.py tests/test_demo_mode.py
      - run: python -m pytest -q tests/test_demo_mode.py
      - run: python -m py_compile app.py demo_mode.py
