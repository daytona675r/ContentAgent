[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contentagent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit",
  "pysqlite3-binary",
  "protobuf==3.20.1",
  "langgraph",
  "langchain",
  "openai",
  "chromadb",
  "tiktoken",
  "python-dotenv",
  "langchain-core",
  "langchain-community",
  "langchain-openai",
  "langchain-google-genai",
  "tavily-python",
  "pypdf",
  "fastapi",
  "uvicorn[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
