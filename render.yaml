services:
  - type: web
    name: pulse-demo-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DEMO_MODE
        value: "true"
      - key: PULSE_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: pulse-demo-web
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: frontend
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
